name: Build APK
on:
  push:
    branches: [main]
    paths-ignore:
      - 'signing/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore signing key
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in signing/debug.keystore.enc -out debug.keystore -pass env:KEY_PASS
      - name: Read Gradle version
        id: gv
        run: echo "v=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.v }}
      - run: gradle assembleRelease --stacktrace -PbuildNumber=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" quran-app.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest quran-app.apk --title "Latest build" --notes "Build ${{ github.run_number }}" --latest
