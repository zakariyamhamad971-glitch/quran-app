name: Create signing key
on: workflow_dispatch
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate and encrypt keystore
        env:
          KEY_PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          test -n "$KEY_PASS" || { echo "secret missing"; exit 1; }
          test ! -f signing/debug.keystore.enc || { echo "key already exists"; exit 1; }
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p signing
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in debug.keystore -out signing/debug.keystore.enc -pass env:KEY_PASS
          rm debug.keystore
          git config user.name github-actions
          git config user.email actions@github.com
          git add signing/debug.keystore.enc
          git commit -m "Add encrypted signing key"
          git push
